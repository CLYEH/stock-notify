name: daily-stock-job

on:
  schedule:
    # 06:30 UTC = 台北 14:30（收盤 13:30 後，證交所已公布當日行情）
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}  # 手動觸發用

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  run:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run job
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          VOLUME_MULTIPLIER: ${{ secrets.VOLUME_MULTIPLIER }}
        # 失敗時回傳非零 exit code，workflow 會顯示紅燈
        run: python -m stock_notify
