name: daily-stock-job

on:
  schedule:
    # 08:00 UTC = 台北 16:00。收盤 13:30 後留 2.5 小時緩衝：
    # 證交所的行情端點更新有延遲，太早執行會抓不到當日資料而失敗。
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}  # 手動觸發用
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  run:
    needs: check
    # push / pull_request 只跑 check，不執行分析 ——
    # 否則每次推程式碼都會對訂閱者發出一則買賣通知。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run job
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          VOLUME_MULTIPLIER: ${{ secrets.VOLUME_MULTIPLIER }}
        # 失敗時回傳非零 exit code，workflow 會顯示紅燈
        run: python -m stock_notify
